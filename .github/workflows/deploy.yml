name: Practice 7 CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: practice7-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      AWS_REGION: us-east-1
      ECR_REPO: ${{ vars.ECR_REPO }}
      STACK_NAME: practice7-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to private ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS \
              --password-stdin "${ECR_REPO%%/*}"

      - name: Check for existing image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name practice7-web \
            --output json > images.json

          python - <<'PY'
          import json
          import os

          images = json.load(open("images.json"))["imageDetails"]
          exists = any(
              os.environ["GITHUB_SHA"] in image.get("imageTags", [])
              for image in images
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"exists={str(exists).lower()}\n")

          print(f"Image already published: {exists}")
          PY

      - name: Log in to public ECR
        if: steps.image.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS \
              --password-stdin public.ecr.aws

      - name: Build new image
        if: steps.image.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if docker build \
              --build-arg APP_VERSION="$GITHUB_SHA" \
              --tag "$ECR_REPO:$GITHUB_SHA" .; then
              exit 0
            fi
            echo "Build attempt $attempt failed"
            sleep 10
          done

          exit 1

      - name: Pull existing image
        if: steps.image.outputs.exists == 'true'
        run: docker pull "$ECR_REPO:$GITHUB_SHA"

      - name: Test container health
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --name practice7-test \
            -p 127.0.0.1:8080:8080 "$ECR_REPO:$GITHUB_SHA"

          trap 'docker logs practice7-test; docker rm -f practice7-test' EXIT

          for attempt in {1..15}; do
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:8080/health \
              --output health.json; then
              python -c 'import json; assert json.load(open("health.json"))["status"] == "ok"'
              exit 0
            fi

            echo "Waiting for container: $attempt/15"
            sleep 2
          done

          echo "Container did not become healthy"
          exit 1

      - name: Push new image
        if: steps.image.outputs.exists != 'true'
        run: docker push "$ECR_REPO:$GITHUB_SHA"

      - name: Deploy with CloudFormation
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --region us-east-1 \
            --stack-name "$STACK_NAME" \
            --template-file infra/app.yaml \
            --parameter-overrides ImageTag="$GITHUB_SHA" \
            --no-fail-on-empty-changeset

      - name: Verify deployed application
        shell: bash
        run: |
          set -euo pipefail

          APP_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue | [0]" \
            --output text)

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 5 --max-time 10 \
            "$APP_URL/health" --output health.json

          python -c 'import json; assert json.load(open("health.json"))["status"] == "ok"'

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 5 --max-time 10 \
            "$APP_URL/" --output deployed.json

          python - <<'PY'
          import json
          import os

          data = json.load(open("deployed.json"))
          print(json.dumps(data, indent=2))

          assert data["version"] == os.environ["GITHUB_SHA"], \
              "Deployed version does not match commit"
          PY

          echo "### Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Application: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $ECR_REPO:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Show stack events on failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --max-items 15 \
            --query 'StackEvents[].{Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
            --output table
